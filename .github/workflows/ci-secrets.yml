name: CI / Secret Scan

# Ported from capbot/ci/buildspec-ci-secrets.yml (identical in
# capmobai-frontend). Installed from the GitHub release rather than via the
# marketplace action, which prompts for a GITLEAKS_LICENSE on org accounts.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gitleaks detect` walks git history. The CodeBuild projects used
          # git_clone_depth=1, which quietly limited the scan to a single
          # commit; full history is what makes this check worth running, and
          # it is cheap on a repo this size.
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.24.3
        # --retry: GitHub's release CDN occasionally drops the connection
        # outright (curl exit 56) rather than returning a slow response,
        # which failed this install step on back-to-back capbot runs with no
        # code change involved. A plain retry resolves it without touching
        # the scan below.
        run: |
          curl --retry 5 --retry-delay 3 --retry-connrefused -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --verbose --redact
