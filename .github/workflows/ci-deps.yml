name: CI / Dependency Audit

# Ported from capbot/ci/buildspec-ci-deps.yml (pip-audit) and
# capmobai-frontend/ci/buildspec-ci-deps.yml (npm audit).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - run: pip install pip-audit

      # Retry loop carried over from capbot: pip-audit queries pypi.org
      # per-package, and a transient ReadTimeoutError at the default 15s
      # socket timeout failed the step with no dependency change involved.
      # A longer timeout plus a plain retry absorbs that without masking a
      # real finding — pip-audit still exits non-zero on an actual
      # vulnerability, and this loop only retries on failure.
      - name: Run pip-audit
        run: |
          for attempt in 1 2 3; do
            pip-audit --timeout 60 -r backend/requirements.txt && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "pip-audit attempt $attempt failed, retrying..."
            sleep 5
          done

  frontend:
    name: npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: Run npm audit
        run: npm audit --audit-level=critical
