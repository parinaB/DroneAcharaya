name: CI / Lint

# Ported from capbot/ci/buildspec-ci-lint.yml and
# capmobai-frontend/ci/buildspec-ci-lint.yml. Those run on CodeBuild with
# PR-only webhooks; this repo has no AWS footprint, so the same checks run
# on GitHub Actions — and on push as well as pull_request.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Only the linters, not requirements.txt — mypy.ini sets
      # ignore_missing_imports, so pulling torch (~800MB) in just to
      # type-check stubs would cost minutes per run for nothing.
      - name: Install linters
        run: pip install ruff mypy

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy type-check
        run: mypy .

  frontend:
    name: ESLint + tsc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts

      - name: ESLint
        run: npm run lint

      - name: TypeScript type-check
        run: npm run typecheck
