[mypy]
python_version = 3.11
ignore_missing_imports = True
exclude = (?x)(^frontend/ | ^ml/artifacts/)
# ml/training/{autoencoder,xgboost_classifier,lstm_rul}/train.py share a
# basename. Without package __init__.py files mypy resolves all three to a
# module named `train` and aborts with "Duplicate module named 'train'", so
# ml/ and its training subfolders are real packages (see __init__.py there).
