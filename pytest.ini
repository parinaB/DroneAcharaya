[pytest]
testpaths = backend/tests
pythonpath = backend
# Coverage is reported but NOT gated. The measured baseline is 87% (1 test,
# checked 2026-08-27), which only looks healthy because the backend is a
# scaffold whose statements are almost all imports and decorators — an 80%
# gate would pass today and then block the first PR that adds real module
# logic ahead of its tests. Turn the gate on (`--cov-fail-under=80`, matching
# capbot) once the modules have behaviour worth covering.
addopts = --cov=backend/app --cov-report=term-missing
